<script>requireAuth();</script>
<script>

// ✅ GRADE GUARD — لو مش أدمن ومحددش صفه يتوجّه للـ dashboard
async function checkGradeGuard() {
  const user = sb.getUser();
  if (!user) return;
  try {
    const profile = await sb.select('profiles', `select=grade,role&id=eq.${user.id}`);
    const grade = profile?.[0]?.grade || '';
    const role  = profile?.[0]?.role  || '';
    if (!grade && role !== 'admin') {
      // بلوك المحتوى وأظهر رسالة
      document.querySelectorAll('.main .page').forEach(p => {
        p.innerHTML = `
          <div style="text-align:center;padding:80px 20px;max-width:400px;margin:0 auto;">
            <div style="font-size:64px;margin-bottom:16px;"><svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.6;stroke:var(--accent)"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
            <h3 style="font-size:18px;font-weight:900;margin-bottom:8px;">حدد صفك الدراسي أولاً</h3>
            <p style="font-size:13px;color:var(--text-dim);line-height:1.8;margin-bottom:24px;">
              لازم تحدد صفك الدراسي من الرئيسية<br>عشان تقدر تستخدم المنصة
            </p>
            <button onclick="window.location.href='dashboard.html'"
              style="background:var(--accent);color:#000;border:none;border-radius:12px;padding:14px 32px;
                     font-family:'Cairo',sans-serif;font-size:14px;font-weight:700;cursor:pointer;width:100%;max-width:260px;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:middle;margin-left:6px;"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg> اختار صفك دلوقتي
            </button>
          </div>`;
      });
    }
  } catch(e) {
    // لو فشل الاتصال ومفيش cache — وجّهه للـ dashboard
    if (!localStorage.getItem('ibda3_grade')) {
      window.location.href = 'dashboard.html';
    }
  }
}

  // شغّل الـ guard بعد تحميل الـ supabase
  document.addEventListener('DOMContentLoaded', () => checkGradeGuard());
</script>
<script>
  async function initFavorites() {
    const grid = document.getElementById('favGrid');
    const empty = document.getElementById('favEmpty');

    // جيب الكورسات من Supabase أو localStorage
    const allCourses = await Courses.getAll();
    const favIds = await Courses.getFavorites();

    const favCourses = allCourses.filter(c => favIds.includes(c.id));
    const thumbClasses = ['t1','t2','t3','t4','t5','t6'];

    if (favCourses.length === 0) {
      empty.style.display = 'block';
    } else {
      grid.innerHTML = favCourses.map((c, i) => `
        <div class="course-card">
          <button class="fav-btn active" onclick="removeFav(this,'${c.id}')"><svg width="16" height="16" viewBox="0 0 24 24" fill="var(--accent)" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></button>
          <div class="course-thumb ${thumbClasses[i%6]}">${c.emoji||'<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>'}</div>
          <div class="course-info">
            <h4>${c.title}</h4>
            <p class="cdesc">${c.description||c.desc||''}</p>
            <div class="course-foot" style="margin-top:10px;">
              ${(c.price==0||!c.price) ? '<span class="badge badge-free">مجاني</span>' : `<span class="badge badge-paid">${c.price} ج.م</span>`}
              <button class="course-btn btn-enroll" onclick="window.location.href='course-detail.html?id=${c.id}'">فتح</button>
            </div>
          </div>
        </div>`).join('');
    }
  }

  async function removeFav(btn, id) {
    await Courses.toggleFavorite(id);
    btn.closest('.course-card').remove();
    showToast('تم الحذف من المفضلة');
    if (document.querySelectorAll('.course-card').length === 0) {
      document.getElementById('favEmpty').style.display = 'block';
    }
  }

  initFavorites();
</script>
