<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALSHEHAB — لوحة التحكم</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚙️</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    /* ══════════════════════════ ADMIN STYLES ══════════════════════════ */
    .admin-tabs-bar { display:flex; gap:5px; flex-wrap:wrap; background:var(--bg2); border:1px solid var(--border); border-radius:14px; padding:6px; margin-bottom:20px; }
    .atab { padding:9px 14px; border-radius:9px; font-size:12px; font-weight:700; cursor:pointer; color:var(--text-dim); border:none; background:transparent; font-family:'Cairo',sans-serif; transition:all .2s; display:flex; align-items:center; gap:5px; white-space:nowrap; }
    .atab:hover { background:var(--bg3); color:var(--text); }
    .atab.active { background:var(--accent); color:#000; }
    .admin-section { display:none; }
    .admin-section.active { display:block; animation:fadeUp .3s ease; }

    /* KPI */
    .kpi-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:12px; margin-bottom:20px; }
    .kpi-card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px; position:relative; overflow:hidden; cursor:default; transition:transform .2s; }
    .kpi-card:hover { transform:translateY(-2px); }
    .kpi-card::before { content:''; position:absolute; top:-15px; left:-15px; width:70px; height:70px; border-radius:50%; background:var(--kc,var(--accent)); opacity:.1; }
    .kpi-num { font-size:26px; font-weight:900; color:var(--kc,var(--accent)); }
    .kpi-lbl { font-size:11px; color:var(--text-dim); margin-top:3px; }
    .kpi-icon { position:absolute; top:12px; left:12px; font-size:20px; opacity:.35; }
    .kpi-delta { font-size:10px; margin-top:5px; }
    .kpi-delta.up { color:#22c55e; } .kpi-delta.dn { color:#ef4444; }

    /* Charts */
    .chart-row { display:grid; grid-template-columns:2fr 1fr; gap:14px; margin-bottom:18px; }
    .bar-chart-wrap { display:flex; align-items:flex-end; gap:6px; height:110px; }
    .bc { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; height:100%; justify-content:flex-end; }
    .bf { width:100%; border-radius:4px 4px 0 0; transition:height .8s cubic-bezier(.4,0,.2,1); min-height:3px; }
    .bv { font-size:9px; color:var(--accent); font-weight:700; }
    .bl { font-size:9px; color:var(--text-dim); }
    .donut-wrap { display:flex; align-items:center; justify-content:center; position:relative; margin-bottom:10px; }
    .donut-center { position:absolute; text-align:center; pointer-events:none; }
    .donut-center b { font-size:18px; font-weight:900; color:var(--accent); display:block; }
    .donut-center small { font-size:9px; color:var(--text-dim); }
    .leg-item { display:flex; align-items:center; gap:7px; font-size:11px; color:var(--text-dim); margin-bottom:6px; }
    .leg-dot { width:9px; height:9px; border-radius:50%; flex-shrink:0; }
    .rev-row { display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid rgba(255,255,255,.04); font-size:12px; }
    .rev-bar { flex:1; height:7px; background:var(--bg3); border-radius:3px; overflow:hidden; }
    .rev-fill { height:100%; border-radius:3px; background:linear-gradient(90deg,var(--accent),#6366f1); transition:width .8s ease; }

    /* Tables */
    .dtbl { width:100%; border-collapse:collapse; font-size:12px; }
    .dtbl th { text-align:right; padding:9px 12px; color:var(--text-dim); font-size:11px; border-bottom:1px solid var(--border); font-weight:700; white-space:nowrap; }
    .dtbl td { padding:10px 12px; border-bottom:1px solid rgba(255,255,255,.04); vertical-align:middle; }
    .dtbl tr:hover td { background:var(--bg3); }
    .tbl-wrap { overflow-x:auto; }
    .tsearch { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; align-items:center; }
    .tsearch input,.tsearch select { background:var(--bg3); border:1px solid var(--border); border-radius:9px; padding:8px 12px; color:var(--text); font-family:'Cairo',sans-serif; font-size:12px; outline:none; }
    .tsearch input { flex:1; min-width:160px; }
    .tsearch input:focus,.tsearch select:focus { border-color:var(--accent); }

    /* Buttons */
    .ab { padding:5px 11px; border-radius:7px; font-size:11px; font-weight:700; cursor:pointer; border:1px solid; font-family:'Cairo',sans-serif; transition:all .2s; }
    .ab:hover { opacity:.8; transform:scale(1.03); }
    .ab.g { background:rgba(34,197,94,.1); border-color:rgba(34,197,94,.4); color:#22c55e; }
    .ab.r { background:rgba(239,68,68,.1); border-color:rgba(239,68,68,.3); color:#ef4444; }
    .ab.b { background:rgba(59,130,246,.1); border-color:rgba(59,130,246,.3); color:#60a5fa; }
    .ab.o { background:rgba(249,115,22,.1); border-color:rgba(249,115,22,.3); color:#fb923c; }
    .ab.y { background:rgba(251,191,36,.1); border-color:rgba(251,191,36,.3); color:#fbbf24; }

    /* Badges */
    .badge { display:inline-block; padding:2px 9px; border-radius:20px; font-size:10px; font-weight:700; white-space:nowrap; }
    .badge.active  { background:rgba(34,197,94,.12);  color:#22c55e; }
    .badge.soon    { background:rgba(251,191,36,.12);  color:#fbbf24; }
    .badge.pending { background:rgba(249,115,22,.12);  color:#fb923c; }
    .badge.paid    { background:rgba(0,212,170,.12);   color:var(--accent); }
    .badge.rejected{ background:rgba(239,68,68,.12);   color:#ef4444; }
    .badge.admin   { background:rgba(168,85,247,.15);  color:#c084fc; }

    /* Forms */
    .fg2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .fg3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
    .fgrp label { display:block; font-size:11px; font-weight:700; color:var(--text-dim); margin-bottom:5px; }
    .fgrp .inp { width:100%; }
    .av-sm { width:30px; height:30px; border-radius:50%; background:linear-gradient(135deg,var(--accent),var(--accent3)); display:inline-flex; align-items:center; justify-content:center; font-size:12px; font-weight:900; color:#000; flex-shrink:0; }

    /* Modals */
    .amodal { position:fixed; inset:0; background:rgba(0,0,0,.65); z-index:8000; display:none; align-items:center; justify-content:center; padding:16px; }
    .amodal.show { display:flex; }
    .amodal-box { background:var(--card); border:1px solid var(--border); border-radius:18px; padding:26px; max-width:500px; width:100%; max-height:90vh; overflow-y:auto; animation:fadeUp .3s ease; }
    .amodal-box h3 { font-size:16px; font-weight:900; margin-bottom:16px; }
    .mfoot { display:flex; gap:10px; margin-top:16px; }
    .mfoot button { flex:1; padding:11px; border-radius:10px; font-family:'Cairo',sans-serif; font-size:13px; font-weight:700; cursor:pointer; border:none; }
    .mfoot .mprim { background:var(--accent); color:#000; }
    .mfoot .mcanc { background:var(--bg3); color:var(--text); }

    /* Notif targets */
    .ntargets { display:flex; gap:7px; flex-wrap:wrap; margin-bottom:12px; }
    .ntar { padding:6px 13px; border-radius:20px; border:1px solid var(--border); font-size:12px; cursor:pointer; transition:all .2s; color:var(--text-dim); }
    .ntar.sel { background:rgba(0,212,170,.12); border-color:var(--accent); color:var(--accent); font-weight:700; }

    /* Settings */
    .srow { display:flex; align-items:center; justify-content:space-between; padding:13px; background:var(--bg3); border-radius:10px; margin-bottom:9px; }
    .srow-info strong { font-size:13px; font-weight:700; }
    .srow-info small { display:block; font-size:11px; color:var(--text-dim); margin-top:2px; }

    /* Payment card */
    .pay-card { background:var(--bg3); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:13px; }
    .pay-head { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:11px; flex-wrap:wrap; gap:8px; }
    .pay-acts { display:flex; gap:8px; margin-top:11px; }

    /* Lesson row */
    .lrow { background:var(--bg3); border:1px solid var(--border); border-radius:10px; padding:12px; margin-bottom:9px; }

    /* Mini prog */
    .mprog { height:4px; background:var(--bg3); border-radius:3px; overflow:hidden; margin-top:3px; }
    .mprog-f { height:100%; background:linear-gradient(90deg,var(--accent),#6366f1); border-radius:3px; }

    /* Pagination */
    .pag { display:flex; gap:5px; align-items:center; justify-content:center; flex-wrap:wrap; padding:12px; }
    .pb { width:30px; height:30px; border-radius:7px; border:1px solid var(--border); background:var(--bg3); color:var(--text); cursor:pointer; font-size:12px; font-weight:700; transition:all .2s; }
    .pb.active { background:var(--accent); color:#000; border-color:var(--accent); }
    .pb:hover:not(.active) { border-color:var(--accent); color:var(--accent); }

    /* Sec header */
    .sh { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:9px; }
    .sh h3 { font-size:15px; font-weight:900; margin:0; }

    /* Maintenance Screen */
    #maintScreen { position:fixed; inset:0; background:var(--bg); z-index:9000; display:none; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:30px; }
    #maintScreen.show { display:flex; }
    .maint-icon { font-size:80px; margin-bottom:20px; animation:spin 4s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .maint-title { font-size:32px; font-weight:900; margin-bottom:10px; }
    .maint-sub { color:var(--text-dim); font-size:15px; max-width:400px; line-height:1.7; margin-bottom:30px; }
    .maint-countdown { display:flex; gap:16px; justify-content:center; margin-bottom:30px; }
    .maint-unit { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px 22px; text-align:center; }
    .maint-unit b { font-size:32px; font-weight:900; color:var(--accent); display:block; }
    .maint-unit span { font-size:11px; color:var(--text-dim); }
    .maint-contact { background:rgba(0,212,170,.08); border:1px solid var(--border); border-radius:14px; padding:16px 24px; font-size:13px; color:var(--text-dim); }
    .maint-contact a { color:var(--accent); font-weight:700; text-decoration:none; }

    /* Notif log */
    .nlog-item { display:flex; align-items:flex-start; gap:11px; padding:11px 0; border-bottom:1px solid rgba(255,255,255,.04); }
    .nlog-icon { width:32px; height:32px; border-radius:50%; background:rgba(0,212,170,.1); display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0; }

    /* Toggle label */
    .chk-lbl { display:flex; align-items:center; gap:7px; font-size:13px; cursor:pointer; user-select:none; }

    /* Tooltip */
    [data-tip] { position:relative; cursor:help; }
    [data-tip]::after { content:attr(data-tip); position:absolute; bottom:120%; right:50%; transform:translateX(50%); background:#000; color:#fff; font-size:10px; padding:3px 8px; border-radius:5px; white-space:nowrap; opacity:0; pointer-events:none; transition:opacity .2s; z-index:9999; }
    [data-tip]:hover::after { opacity:1; }

    /* ══ WIZARD ══ */
    .course-wizard { background:var(--card); border:1px solid var(--border); border-radius:18px; padding:22px; }
    .wizard-steps { display:flex; align-items:center; margin-bottom:24px; gap:0; }
    .wstep { display:flex; align-items:center; gap:8px; flex-shrink:0; }
    .wnum { width:28px; height:28px; border-radius:50%; background:var(--bg3); border:2px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:900; color:var(--text-dim); transition:all .3s; flex-shrink:0; }
    .wtxt { font-size:11px; color:var(--text-dim); font-weight:600; white-space:nowrap; transition:color .3s; }
    .wline { flex:1; height:2px; background:var(--border); margin:0 8px; min-width:12px; transition:background .3s; }
    .wstep.active .wnum { background:var(--accent); border-color:var(--accent); color:#000; }
    .wstep.active .wtxt { color:var(--accent); }
    .wstep.done .wnum { background:rgba(0,212,170,.15); border-color:var(--accent); color:var(--accent); }
    .wstep.done .wnum::after { content:'✓'; }
    .wstep.done .wtxt { color:var(--accent); opacity:.7; }
    .wline.done { background:var(--accent); }
    .wpanel { display:none; animation:fadeUp .3s ease; }
    .wpanel.active { display:block; }
    .wpanel-title { font-size:15px; font-weight:900; margin-bottom:18px; display:flex; align-items:center; gap:8px; }

    /* Upload drop zone */
    .upload-drop { border:2px dashed var(--border); border-radius:14px; padding:30px 20px; text-align:center; cursor:pointer; transition:all .25s; user-select:none; }
    .upload-drop:hover, .upload-drop.drag { border-color:var(--accent); background:rgba(0,212,170,.04); }

    /* PDF item */
    .pdf-item { display:flex; align-items:center; gap:10px; padding:10px 12px; background:var(--bg3); border-radius:9px; margin-bottom:7px; font-size:12px; }
    .pdf-item .pi-name { flex:1; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .pdf-item .pi-size { color:var(--text-dim); font-size:10px; flex-shrink:0; }
    .pdf-item .pi-status { font-size:10px; flex-shrink:0; }

    @media(max-width:520px) { .wtxt { display:none; } .wline { min-width:8px; } }


</head>
<body>
<div id="toast"></div>
<div class="offline-badge" id="offlineBadge">⚠️ غير متصل</div>

<!-- ══════ MAINTENANCE SCREEN ══════ -->
<div id="maintScreen">
  <div class="maint-icon">🔧</div>
  <div class="maint-title">قيد الصيانة</div>
  <div class="maint-sub" id="maintMsg">المنصة في وضع الصيانة مؤقتاً. نعمل على تحسينها وستعود قريباً!</div>
  <div class="maint-countdown" id="maintCountdown" style="display:none;">
    <div class="maint-unit"><b id="mH">00</b><span>ساعة</span></div>
    <div class="maint-unit"><b id="mM">00</b><span>دقيقة</span></div>
    <div class="maint-unit"><b id="mS">00</b><span>ثانية</span></div>
  </div>
  <div class="maint-contact">للتواصل: <a href="https://wa.me/201063786533" target="_blank">واتساب 📞 01063786533</a></div>
</div>

<!-- ══════ MODALS ══════ -->
<!-- Edit Course -->
<div class="amodal" id="mEditCourse">
  <div class="amodal-box">
    <h3>✏️ تعديل الكورس</h3>
    <input type="hidden" id="eCid">
    <div class="fg2" style="gap:11px;margin-bottom:11px;">
      <div class="fgrp"><label>اسم الكورس</label><input class="inp" id="eTitle"></div>
      <div class="fgrp"><label>إيموجي</label><input class="inp" id="eEmoji" maxlength="2"></div>
      <div class="fgrp" style="grid-column:1/-1;"><label>الوصف</label><input class="inp" id="eDesc"></div>
      <div class="fgrp"><label>الفئة</label><select class="inp" id="eCat"><option value="math">📐 رياضيات</option><option value="science">🔬 علوم</option><option value="lang">🌍 لغات</option><option value="code">💻 برمجة</option><option value="other">📚 أخرى</option></select></div>
      <div class="fgrp"><label>السعر (0=مجاني)</label><input class="inp" type="number" id="ePrice" min="0"></div>
      <div class="fgrp"><label>المدرّس</label><input class="inp" id="eInstructor"></div>
      <div class="fgrp"><label>الحالة</label><select class="inp" id="eStatus"><option value="active">✅ منشور</option><option value="soon">⏳ قريباً</option></select></div>
    </div>
    <div style="display:flex;gap:14px;">
      <label class="chk-lbl"><input type="checkbox" id="eIsNew"> 🆕 جديد</label>
      <label class="chk-lbl"><input type="checkbox" id="eIsHot"> 🔥 الأكثر</label>
    </div>
    <div class="mfoot"><button class="mprim" onclick="saveEditCourse()">💾 حفظ</button><button class="mcanc" onclick="closeM('mEditCourse')">إلغاء</button></div>
  </div>
</div>

<!-- Enroll -->
<div class="amodal" id="mEnroll">
  <div class="amodal-box">
    <h3>➕ تسجيل طالب في كورس</h3>
    <div class="fgrp" style="margin-bottom:11px;"><label>User ID الطالب</label><input class="inp" id="enUID" placeholder="من Supabase auth.users"></div>
    <div class="fgrp" style="margin-bottom:11px;"><label>الكورس</label><select class="inp" id="enCourse"><option value="">-- اختر --</option></select></div>
    <div class="mfoot"><button class="mprim" onclick="doEnroll()">✅ تسجيل</button><button class="mcanc" onclick="closeM('mEnroll')">إلغاء</button></div>
  </div>
</div>

<!-- Coupon -->
<div class="amodal" id="mCoupon">
  <div class="amodal-box">
    <h3>🏷️ كوبون خصم جديد</h3>
    <div class="fg2" style="gap:11px;margin-bottom:11px;">
      <div class="fgrp"><label>الكود</label><input class="inp" id="cpCode" placeholder="IBDA350" oninput="this.value=this.value.toUpperCase()"></div>
      <div class="fgrp"><label>الخصم %</label><input class="inp" type="number" id="cpDisc" min="1" max="100" placeholder="50"></div>
      <div class="fgrp"><label>كورس معين (اختياري)</label><select class="inp" id="cpCourse"><option value="">كل الكورسات</option></select></div>
      <div class="fgrp"><label>حد الاستخدام (0=لانهائي)</label><input class="inp" type="number" id="cpLimit" value="0"></div>
    </div>
    <div class="mfoot"><button class="mprim" onclick="saveCoupon()">✅ حفظ</button><button class="mcanc" onclick="closeM('mCoupon')">إلغاء</button></div>
  </div>
</div>

<!-- Notif Modal -->
<div class="amodal" id="mNotif">
  <div class="amodal-box">
    <h3>🔔 إرسال إشعار</h3>
    <div class="ntargets" id="ntM">
      <div class="ntar sel" onclick="pickTarget('all','ntM')">👥 الكل</div>
      <div class="ntar" onclick="pickTarget('user','ntM')">👤 طالب معين</div>
    </div>
    <div id="ntMUser" style="display:none;margin-bottom:11px;"><input class="inp" id="mUID" placeholder="User ID..."></div>
    <div class="fgrp" style="margin-bottom:11px;"><label>العنوان</label><input class="inp" id="mTitle" placeholder="عنوان الإشعار..."></div>
    <div class="fgrp" style="margin-bottom:11px;"><label>النص</label><textarea class="notes-area" id="mBody" rows="3" style="margin-bottom:0;"></textarea></div>
    <div class="mfoot"><button class="mprim" onclick="sendNotif('modal')">📤 إرسال</button><button class="mcanc" onclick="closeM('mNotif')">إلغاء</button></div>
  </div>
</div>

<!-- Maintenance Settings Modal -->
<div class="amodal" id="mMaint">
  <div class="amodal-box">
    <h3>🔧 إعدادات وضع الصيانة</h3>
    <div class="fgrp" style="margin-bottom:11px;"><label>رسالة الصيانة للطلاب</label><textarea class="notes-area" id="maintMsgInp" rows="3" style="margin-bottom:0;">المنصة في وضع الصيانة مؤقتاً. نعمل على تحسينها وستعود قريباً!</textarea></div>
    <div class="fgrp" style="margin-bottom:14px;">
      <label>⏳ وقت العودة (اختياري)</label>
      <input class="inp" type="datetime-local" id="maintEnd">
      <small style="color:var(--text-dim);font-size:11px;margin-top:4px;display:block;">اتركه فارغاً لو مش عارف الوقت بالظبط</small>
    </div>
    <div class="fgrp" style="margin-bottom:14px;">
      <label class="chk-lbl"><input type="checkbox" id="maintNotifChk" checked> إرسال إشعار للطلاب بوضع الصيانة</label>
    </div>
    <div style="background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);border-radius:10px;padding:12px;font-size:12px;color:#fca5a5;margin-bottom:14px;">
      ⚠️ لما تفعّل وضع الصيانة، كل الطلاب هيشوفوا شاشة الصيانة. الأدمن يفضل يدخل عادي.
    </div>
    <div class="mfoot">
      <button class="mprim" style="background:#ef4444;" onclick="activateMaintenance()">🔴 تفعيل الصيانة</button>
      <button class="mcanc" onclick="closeM('mMaint')">إلغاء</button>
    </div>
  </div>
</div>

<!-- Float + Settings Panel -->
<div class="settings-panel" id="settingsPanel">
  <h4>🎨 لون المنصة</h4>
  <div class="theme-dots">
    <div class="tdot active" style="background:#00d4aa" onclick="setColor('green')"></div>
    <div class="tdot" style="background:#3b82f6" onclick="setColor('blue')"></div>
    <div class="tdot" style="background:#a855f7" onclick="setColor('purple')"></div>
    <div class="tdot" style="background:#f97316" onclick="setColor('orange')"></div>
  </div>
  <h4>🌙 المظهر</h4>

async function loadStats() {
  try {
    const [courses, enrolments, payments] = await Promise.all([
      sb.select('courses', 'select=id,title,price,lessons_count,rating,students,status,category,emoji').catch(() => []),
      sb.select('enrollments', 'select=id,completed,user_id,course_id,enrolled_at').catch(() => []),
      sb.select('payment_requests', 'status=eq.approved&select=amount,created_at,course_id').catch(() => []),
    ]);

    const C  = Array.isArray(courses)    ? courses    : [];
    const E  = Array.isArray(enrolments) ? enrolments : [];
    const P  = Array.isArray(payments)   ? payments   : [];
    const done  = E.filter(e => e.completed);
    const uids  = [...new Set(E.map(e => e.user_id))];
    const rev   = P.reduce((a,p) => a + (parseFloat(p.amount)||0), 0);

    document.getElementById('kCourses').textContent  = C.length;
    document.getElementById('kStudents').textContent = uids.length;
    document.getElementById('kCompleted').textContent= done.length;
    document.getElementById('kRevenue').textContent  = rev > 999 ? (rev/1000).toFixed(1)+'K' : rev;
    document.getElementById('kActive').textContent   = Math.max(1, Math.floor(uids.length * 0.12));
    document.getElementById('kRate').textContent     = pct(done.length, E.length) + '%';

    renderEnrollChart(E);
    renderDonut(C);
    renderRevChart(P);
    renderTopCourses(C, E, P);

    allCourses = C;
    document.getElementById('ctCount').textContent = C.length;
    document.getElementById('stCount').textContent = uids.length;
    revenueData = { P };
  } catch(e) { console.error('loadStats', e); }
}

function renderEnrollChart(E) {
  const days = ['أح','إث','ثل','أر','خم','جم','سب'];
  const today = new Date().getDay();
  const counts = Array(7).fill(0);
  const now = Date.now();
  E.forEach(e => { const d = Math.floor((now - new Date(e.enrolled_at)) / 86400000); if (d < 7) counts[6 - d]++; });
  const max = Math.max(...counts, 1);
  document.getElementById('enrollChart').innerHTML = counts.map((c,i) => {
    const day = days[(today - 6 + i + 7) % 7];
    const h   = Math.max(5, Math.round((c/max)*100));
    const last = i === 6;
    return `<div class="bc"><div class="bv">${c||''}</div><div class="bf" style="height:${h}%;background:${last?'linear-gradient(180deg,#f97316,rgba(249,115,22,.3))':'linear-gradient(180deg,var(--accent),rgba(0,212,170,.3))'}"></div><div class="bl" style="${last?'color:#f97316;font-weight:700':''}">${day}</div></div>`;
  }).join('');
}

function renderDonut(C) {
  const cats = {};
  C.forEach(c => { const k = c.status||'active'; cats[k] = (cats[k]||0)+1; });
  const colors = { active:'#00d4aa', soon:'#fbbf24', draft:'#6366f1' };
  const data = Object.entries(cats).map(([k,v]) => ({k,v,color:colors[k]||'#ec4899'}));
  const r=35,cx=50,cy=50,circ=2*Math.PI*r;
  let off = 0;
  document.getElementById('donutSvg').innerHTML = data.map(d => {
    const dash = circ*(d.v/C.length||0), gap = circ-dash;
    const el = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${d.color}" stroke-width="14" stroke-dasharray="${dash} ${gap}" stroke-dashoffset="${-off*circ/(C.length||1)}"/>`;
    off += d.v; return el;
  }).join('') + `<circle cx="${cx}" cy="${cy}" r="27" fill="var(--card)"/>`;
  document.getElementById('donutN').textContent = C.length;
  const lbs = {active:'منشور',soon:'قريباً',draft:'مسودة'};
  document.getElementById('donutLeg').innerHTML = data.map(d => `<div class="leg-item"><div class="leg-dot" style="background:${d.color}"></div><span>${lbs[d.k]||d.k}</span><b style="margin-right:auto;color:${d.color}">${d.v}</b></div>`).join('');
}

function renderRevChart(P) {
  const months = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  const bm = Array(12).fill(0);
  P.forEach(p => { bm[new Date(p.created_at).getMonth()] += parseFloat(p.amount)||0; });
  const max = Math.max(...bm,1);
  document.getElementById('revChart').innerHTML = bm.map((v,i) => `<div class="rev-row"><span style="width:58px;color:var(--text-dim);font-size:11px;">${months[i]}</span><div class="rev-bar"><div class="rev-fill" style="width:${Math.round((v/max)*100)}%"></div></div><span style="width:90px;text-align:left;font-size:12px;font-weight:700;color:var(--accent);">${v>0?v.toLocaleString()+' ج.م':'—'}</span></div>`).join('');
}

function renderTopCourses(C, E, P) {
  const data = C.map(c => ({
    ...c,
    ec: E.filter(e => e.course_id===c.id).length,
    cc: E.filter(e => e.course_id===c.id && e.completed).length,
    rv: P.filter(p => p.course_id===c.id).reduce((a,p) => a+(parseFloat(p.amount)||0), 0),
  })).sort((a,b) => b.ec-a.ec).slice(0,8);
  document.getElementById('topTbody').innerHTML = data.length
    ? data.map((c,i) => `<tr><td style="color:var(--text-dim);font-size:11px;">${i+1}</td><td><b>${c.emoji||'📚'} ${c.title}</b></td><td>${c.ec}</td><td><div class="mprog"><div class="mprog-f" style="width:${pct(c.cc,c.ec)}%"></div></div><span style="font-size:10px;color:var(--text-dim);">${pct(c.cc,c.ec)}%</span></td><td style="color:var(--accent);font-weight:700;">${c.rv>0?c.rv.toLocaleString()+' ج.م':'مجاني'}</td></tr>`).join('')
    : '<tr><td colspan="5" style="text-align:center;color:var(--text-dim);padding:18px;">لا توجد كورسات بعد</td></tr>';
}

function wizGoTo(step) {
  for (let i = 1; i <= 4; i++) {
    const ws = document.getElementById('ws'+i);
    const wp = document.getElementById('wp'+i);
    const wl = document.getElementById('wl'+(i));
    if (ws) {
      ws.classList.remove('active','done');
      if (i < step)       ws.classList.add('done');
      else if (i === step) ws.classList.add('active');
    }
    if (wp) { wp.classList.remove('active'); if (i === step) wp.classList.add('active'); }
  }

  document.querySelectorAll('.wline').forEach((l, i) => {
    l.classList.toggle('done', i + 1 < step);

async function uploadVideoToStorage(file, courseTitle) {
  const ext  = file.name.split('.').pop() || 'mp4';
  const slug = courseTitle.replace(/\s+/g,'_').replace(/[^a-zA-Z0-9_\u0600-\u06FF]/g,'').slice(0,30);
  const path = `videos/${slug}_${Date.now()}.${ext}`;
  const session = JSON.parse(localStorage.getItem('sb_session') || 'null');
  const token   = session?.access_token || sb.key;

  // XMLHttpRequest عشان نتابع progress
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', `${sb.url}/storage/v1/object/course-videos/${path}`);
    xhr.setRequestHeader('apikey', sb.key);
    xhr.setRequestHeader('Authorization', `Bearer ${token}`);
    xhr.setRequestHeader('Content-Type', file.type || 'video/mp4');

    xhr.upload.onprogress = (e) => {
      if (!e.lengthComputable) return;
      const pct = Math.round((e.loaded / e.total) * 100);
      document.getElementById('uploadBar').style.width = pct + '%';
      document.getElementById('uploadPct').textContent = pct + '%';
    };
    xhr.onload = () => {
      if (xhr.status >= 200 && xhr.status < 300) {
        resolve(`${sb.url}/storage/v1/object/public/course-videos/${path}`);
      } else {
        try { reject(new Error(JSON.parse(xhr.responseText).message || 'فشل الرفع')); }
        catch { reject(new Error('فشل رفع الفيديو')); }
      }
    };
    xhr.onerror = () => reject(new Error('خطأ في الشبكة'));
    xhr.send(file);
  });
}

// ── PDF files ──
function addPdfFiles(files) {
  Array.from(files).forEach(f => {
    if (wizPdfFiles.find(p => p.name === f.name)) return;
    wizPdfFiles.push({ file: f, name: f.name, size: f.size, url: '' });
  });
  renderPdfList();
}

function renderPdfList() {
  const wrap = document.getElementById('pdfList');
  if (!wizPdfFiles.length) { wrap.innerHTML = ''; return; }
  wrap.innerHTML = wizPdfFiles.map((p, i) => `
    <div class="pdf-item">
      <span style="font-size:18px;">📄</span>
      <span class="pi-name">${p.name}</span>
      <span class="pi-size">${(p.size/1024/1024).toFixed(2)} MB</span>
      <span class="pi-status">${p.url ? '✅' : '⏳'}</span>
      <button class="ab r" onclick="removePdf(${i})" style="font-size:10px;padding:3px 8px;">✕</button>
    </div>`).join('');
}

function removePdf(i) {
  wizPdfFiles.splice(i, 1);
  renderPdfList();
}

async function uploadPdfs(courseTitle) {
  const slug = courseTitle.replace(/\s+/g,'_').slice(0,30);
  const session = JSON.parse(localStorage.getItem('sb_session')||'null');
  const token   = session?.access_token || sb.key;
  for (const p of wizPdfFiles) {
    if (p.url) continue;
    const path = `pdfs/${slug}_${Date.now()}_${p.name}`;
    const res = await fetch(`${sb.url}/storage/v1/object/course-videos/${path}`, {
      method: 'POST',
      headers: { 'apikey': sb.key, 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/pdf' },
      body: p.file,
    });
    if (res.ok) p.url = `${sb.url}/storage/v1/object/public/course-videos/${path}`;
  }
  renderPdfList();
}

// ── Drag & Drop ──
function dragOver(e, id) { e.preventDefault(); document.getElementById(id).classList.add('drag'); }
function dragLeave(id)   { document.getElementById(id).classList.remove('drag'); }
function dropFile(e, inputId, dropId) {
  e.preventDefault();
  dragLeave(dropId);
  const files = e.dataTransfer.files;
  if (!files.length) return;
  const input = document.getElementById(inputId);
  // DataTransfer trick
  const dt = new DataTransfer();
  Array.from(files).forEach(f => dt.items.add(f));
  input.files = dt.files;
  input.dispatchEvent(new Event('change'));
}

// ── Save course ──
async function addCourse() {
  const title      = document.getElementById('cTitle').value.trim();
  const lTitle     = document.getElementById('lTitle').value.trim();
  if (!title || !lTitle) { showToast('تأكد من اكتمال البيانات ⚠️'); return; }

  const btn = document.getElementById('saveCBtn');
  btn.disabled = true; btn.textContent = '⏳ جاري الرفع...';

  try {
    // 1) رفع الفيديو لو موجود ولم يُرفع بعد
    const videoFile = document.getElementById('videoFile').files[0];
    if (videoFile && !wizVideoUrl) {
      document.getElementById('uploadProgress').style.display = 'block';
      btn.textContent = '⏳ رفع الفيديو...';
      wizVideoUrl = await uploadVideoToStorage(videoFile, title);
      document.getElementById('uploadProgress').style.display = 'none';
      document.getElementById('videoUrlWrap').style.display   = 'block';
      document.getElementById('videoUrlText').textContent     = wizVideoUrl;
    }

    // 2) رفع PDFs
    if (wizPdfFiles.some(p => !p.url)) {
      btn.textContent = '⏳ رفع الملفات...';
      document.getElementById('pdfUploadStatus').style.display = 'block';
      await uploadPdfs(title);
      document.getElementById('pdfUploadStatus').style.display = 'none';
    }

    // 3) بناء الدرس
    const lesson = {
      id:       'l_0',
      title:    lTitle,
      description: document.getElementById('lDesc').value.trim(),
      duration: parseInt(document.getElementById('lDuration').value) || 0,
      videoUrl: wizVideoUrl || '',
      pdfs:     wizPdfFiles.filter(p => p.url).map(p => ({ name: p.name, url: p.url })),
      order:    1,
    };

    const hours = Math.round((lesson.duration || 0) / 60 * 10) / 10;

    // 4) حفظ الكورس
    btn.textContent = '⏳ حفظ الكورس...';
    await sb.insert('courses', {
      title,
      emoji:        document.getElementById('cEmoji').value.trim() || '📚',
      description:  document.getElementById('cDesc').value.trim(),
      category:     document.getElementById('cCat').value,
      price:        parseFloat(document.getElementById('cPrice').value) || 0,
      status:       document.getElementById('cStatus').value,
      is_new:       document.getElementById('cIsNew').checked,
      is_hot:       document.getElementById('cIsHot').checked,
      lessons:      [lesson],
      lessons_count: 1,
      instructor:   document.getElementById('cInstructor').value.trim(),
      hours,
      rating: 5,
      students: 0,
    });

    // 5) تنظيف
    localStorage.removeItem('alshehab_courses');
    showToast('🚀 تم نشر الكورس بنجاح!');
    wizVideoUrl = '';
    wizPdfFiles = [];
    wizGoTo(1);
    // reset fields
    ['cTitle','cEmoji','cDesc','cPrice','cInstructor','lTitle','lDuration','lDesc'].forEach(id => {
      const el = document.getElementById(id); if(el) el.value = '';
    });
    document.getElementById('cIsNew').checked = false;
    document.getElementById('cIsHot').checked = false;
    clearVideo();
    renderPdfList();
    loadStats();
    loadCoursesTbl();

  } catch(e) {
    showToast('⚠️ ' + e.message);
  } finally {
    btn.disabled = false; btn.textContent = '🚀 نشر الكورس الآن';
  }
}

    allStudents = Array.isArray(data) ? data : [];

function filterStudents(q) { stFilter.q=q.toLowerCase(); stPage=0; renderStudents(); }
function filterStRole(r)   { stFilter.role=r; stPage=0; renderStudents(); }
function sortStudents(s)   { stFilter.sort=s; renderStudents(); }

function getFiltered() {
  let list = allStudents.filter(s =>
    (!stFilter.q    || (s.name||'').toLowerCase().includes(stFilter.q)) &&
    (!stFilter.role || s.role===stFilter.role)
  );
  if (stFilter.sort==='name') list.sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  else list.sort((a,b)=>(b.xp||0)-(a.xp||0));
  return list;
}

function renderStudents() {
  const list  = getFiltered();
  const start = stPage * ST_PER;
  const page  = list.slice(start, start+ST_PER);
  const tbody = document.getElementById('stTbody');
  tbody.innerHTML = page.length
    ? page.map(s => `<tr>
        <td><div style="display:flex;align-items:center;gap:8px"><div class="av-sm">${(s.name||'?').charAt(0).toUpperCase()}</div><div><b style="font-size:12px">${s.name||'—'}</b><div style="font-size:10px;color:var(--text-dim)">${(s.id||'').slice(0,10)}...</div></div></div></td>
        <td>${s.role==='admin'?'<span class="badge admin">أدمن</span>':'<span class="badge active">طالب</span>'}</td>
        <td><b style="color:var(--accent)">${(s.xp||0).toLocaleString()}</b></td>
        <td style="font-size:11px;color:var(--text-dim)">${s.last_active||'—'}</td>
        <td style="white-space:nowrap">
          <button class="ab o" onclick="notifStudent('${s.id}')" style="margin-left:4px" data-tip="إشعار">🔔</button>
          ${s.role!=='admin'?`<button class="ab b" onclick="mkAdmin('${s.id}')" style="margin-left:4px" data-tip="ترقية">👑</button>`:''}
          <button class="ab r" onclick="removeStudent('${s.id}')">🚫</button>
        </td>
      </tr>`).join('')
    : '<tr><td colspan="5" style="text-align:center;color:var(--text-dim);padding:18px">لا توجد نتائج</td></tr>';
  // pagination
  const pages  = Math.ceil(list.length/ST_PER);
  const pagEl  = document.getElementById('stPag');
  pagEl.innerHTML = '';
  if (pages <= 1) return;
  for (let i=0;i<pages;i++) { const b=Object.assign(document.createElement('button'),{className:'pb'+(i===stPage?' active':''),textContent:i+1}); b.onclick=()=>{stPage=i;renderStudents();}; pagEl.appendChild(b); }
}

          <div style="text-align:left"><div style="font-size:22px;font-weight:900;color:var(--accent)">${r.amount} ج.م</div>${statusBadge}</div>
        </div>

          ? `<div style="margin-bottom:11px"><div style="font-size:11px;color:var(--text-dim);margin-bottom:6px">📎 الإيصال:</div><img src="${r.receipt_url}" style="width:100%;max-height:220px;object-fit:contain;border-radius:10px;border:1px solid var(--border);cursor:pointer" onclick="window.open('${r.receipt_url}','_blank')" onerror="this.style.display='none'"><a href="${r.receipt_url}" target="_blank" style="font-size:11px;color:var(--accent);display:block;margin-top:5px">🔗 فتح</a></div>`
          : '<div style="font-size:12px;color:#ef4444;margin-bottom:11px">⚠️ لم يرفع إيصال</div>'
        }
        ${isPend
          ? `<input class="inp" type="text" id="pnote_${r.id}" placeholder="ملاحظة للطالب (اختياري)" style="font-size:12px;margin-bottom:9px">
             <div class="pay-acts"><button onclick="approveReq('${r.id}','${r.user_id}','${r.course_id}')" class="ab g" style="flex:1;padding:10px;font-size:12px">✅ تأكيد</button><button onclick="rejectReq('${r.id}','${r.user_id}')" class="ab r" style="flex:1;padding:10px;font-size:12px">❌ رفض</button></div>`

    }).join('');

}

async function approveReq(rid, uid, cid) {
  const note = document.getElementById('pnote_'+rid)?.value||'';
  document.querySelectorAll(`#preq_${rid} .ab`).forEach(b=>b.disabled=true);
  try {
    await sb.update('payment_requests',{status:'approved',admin_note:note},`id=eq.${rid}`);
    await sb.upsert('enrollments',{user_id:uid,course_id:cid,progress:0,completed:false});
    await sb.insert('notifications',{user_id:uid,title:'✅ تم تأكيد دفعك!',body:'فُتح لك الكورس — ابدأ التعلم الآن 🎓',is_read:false}).catch(()=>{});
    document.getElementById('preq_'+rid)?.remove();
    showToast('✅ تم التأكيد وفُتح الكورس');
    loadPayBadge();
  } catch(e) { showToast('⚠️ '+e.message); document.querySelectorAll(`#preq_${rid} .ab`).forEach(b=>b.disabled=false); }
}

async function rejectReq(rid, uid) {
  const note = document.getElementById('pnote_'+rid)?.value||'تم رفض الطلب';
  document.querySelectorAll(`#preq_${rid} .ab`).forEach(b=>b.disabled=true);
  try {
    await sb.update('payment_requests',{status:'rejected',admin_note:note},`id=eq.${rid}`);
    await sb.insert('notifications',{user_id:uid,title:'❌ تم رفض طلب الدفع',body:`السبب: ${note}`,is_read:false}).catch(()=>{});
    document.getElementById('preq_'+rid)?.remove();
    showToast('تم الرفض ❌'); loadPayBadge();
  } catch(e) { showToast('⚠️ '+e.message); document.querySelectorAll(`#preq_${rid} .ab`).forEach(b=>b.disabled=false); }
}

// ═══════════════════════════════════════════════════════
//  NOTIFICATIONS
// ═══════════════════════════════════════════════════════
function pickTarget(val, groupId) {
  notifTargets[groupId] = val;
  document.querySelectorAll(`#${groupId} .ntar`).forEach(t => t.classList.remove('sel'));
  event.currentTarget.classList.add('sel');
  const userWrap = document.getElementById(groupId==='ntM' ? 'ntMUser' : 'ntQUser');
  if (userWrap) userWrap.style.display = val==='user' ? 'block' : 'none';
}

function applyTpl(val) {
  if (!val || !TPL[val]) return;
  document.getElementById('qTitle').value = TPL[val].t;
  document.getElementById('qBody').value  = TPL[val].b;
}

async function sendNotif(src) {
  const isModal  = src === 'modal';
  const title    = document.getElementById(isModal?'mTitle':'qTitle').value.trim();
  const body     = document.getElementById(isModal?'mBody':'qBody').value.trim();
  const target   = isModal ? notifTargets['ntM'] : notifTargets['ntQ'];
  const uid      = isModal ? document.getElementById('mUID').value.trim() : document.getElementById('qUID').value.trim();
  if (!title) { showToast('اكتب العنوان ⚠️'); return; }

  if (target === 'all') {
    const profiles = await sb.select('profiles','select=id').catch(()=>[]);
    if (!profiles?.length) { showToast('⚠️ لا يوجد طلاب'); return; }
    let sent = 0;
    for (const p of profiles) { await sb.insert('notifications',{user_id:p.id,title,body,is_read:false}).catch(()=>{}); sent++; }
    showToast(`✅ أُرسل لـ ${sent} طالب`);
  } else {
    if (!uid) { showToast('أدخل User ID ⚠️'); return; }
    await sb.insert('notifications',{user_id:uid,title,body,is_read:false}).catch(e=>{ showToast('⚠️ '+e.message); return; });
    showToast('✅ تم الإرسال');
  }

  if (isModal) { closeM('mNotif'); document.getElementById('mTitle').value=''; document.getElementById('mBody').value=''; }
  else { document.getElementById('qTitle').value=''; document.getElementById('qBody').value=''; }
  loadNotifLog();
}

async function loadNotifLog() {
  const wrap = document.getElementById('nLog'); if (!wrap) return;
  try {
    const data = await sb.select('notifications','order=created_at.desc&limit=30');
    if (!Array.isArray(data)||!data.length) { wrap.innerHTML='<div style="text-align:center;padding:24px;color:var(--text-dim)">لا توجد إشعارات مُرسلة</div>'; return; }
    wrap.innerHTML = data.map(n => `<div class="nlog-item"><div class="nlog-icon">${n.is_read?'🔔':'🔴'}</div><div style="flex:1"><b style="font-size:13px">${n.title}</b>${n.body?`<div style="font-size:11px;color:var(--text-dim);margin-top:2px">${n.body}</div>`:''}<div style="font-size:10px;color:var(--text-dim);margin-top:3px">${new Date(n.created_at).toLocaleString('ar-EG')} · ${(n.user_id||'').slice(0,10)}...</div></div></div>`).join('');
  } catch(e) { wrap.innerHTML=`<div style="text-align:center;color:#ef4444;padding:18px">⚠️ ${e.message}</div>`; }
}

// ═══════════════════════════════════════════════════════
//  MAINTENANCE  ← الجديد كاملاً
// ═══════════════════════════════════════════════════════
function checkMaintForVisitor() {
  const s = getSettings();
  if (!s.maintenance) return;  // مفيش صيانة
  // لو المستخدم أدمن — خليه يعدي
  const session = JSON.parse(localStorage.getItem('sb_session')||'null');
  if (!session) { showMaintScreen(s); return; } // مش مسجّل — أريه الصيانة
  // check role fast from profiles cache
  const cached = JSON.parse(localStorage.getItem('alshehab_profile')||'null');
  if (cached?.role === 'admin') return; // أدمن — أكمل
  showMaintScreen(s);
}

function showMaintScreen(s) {
  const el = document.getElementById('maintScreen');
  document.getElementById('maintMsg').textContent = s.maint_msg || 'المنصة في وضع الصيانة مؤقتاً. نعمل على تحسينها وستعود قريباً!';
  el.classList.add('show');
  // Countdown
  if (s.maint_end) {
    const endTime = new Date(s.maint_end).getTime();
    document.getElementById('maintCountdown').style.display = 'flex';
    if (maintTimer) clearInterval(maintTimer);
    maintTimer = setInterval(() => {
      const diff = endTime - Date.now();
      if (diff <= 0) { clearInterval(maintTimer); document.getElementById('maintCountdown').style.display='none'; return; }
      const h = Math.floor(diff/3600000), m = Math.floor((diff%3600000)/60000), sec = Math.floor((diff%60000)/1000);
      document.getElementById('mH').textContent = String(h).padStart(2,'0');
      document.getElementById('mM').textContent = String(m).padStart(2,'0');
      document.getElementById('mS').textContent = String(sec).padStart(2,'0');
    }, 1000);
  }
}

function hideMaintScreen() {
  document.getElementById('maintScreen').classList.remove('show');
  if (maintTimer) clearInterval(maintTimer);
}

function toggleMaint() {
  const el = document.getElementById('tMaint');
  const isOn = el.classList.contains('on');
  if (!isOn) {
    // تفعيل — افتح modal الإعدادات أولاً
    openM('mMaint');
  } else {
    // إيقاف — مباشرة
    deactivateMaintenance();
  }
}

async function activateMaintenance() {
  const msg    = document.getElementById('maintMsgInp').value.trim() || 'المنصة في وضع الصيانة مؤقتاً.';
  const endVal = document.getElementById('maintEnd').value;
  const s      = getSettings();
  s.maintenance = true;
  s.maint_msg   = msg;
  s.maint_end   = endVal || null;
  saveSettings(s);

  document.getElementById('tMaint').classList.add('on');
  closeM('mMaint');

  // Notify students if checked
  if (document.getElementById('maintNotifChk').checked) {
    const profiles = await sb.select('profiles','select=id').catch(()=>[]);
    if (Array.isArray(profiles)) {
      for (const p of profiles) {
        await sb.insert('notifications',{user_id:p.id,title:'🔧 صيانة مجدولة',body:msg,is_read:false}).catch(()=>{});
      }
      showToast(`✅ وضع الصيانة مفعّل + إشعار لـ ${profiles.length} طالب`);
    }
  } else {
    showToast('✅ وضع الصيانة مفعّل');
  }
}

async function deactivateMaintenance() {
  const s = getSettings();
  s.maintenance = false;
  s.maint_end   = null;
  saveSettings(s);
  document.getElementById('tMaint').classList.remove('on');
  hideMaintScreen();
  // Notify students
  const profiles = await sb.select('profiles','select=id').catch(()=>[]);
  if (Array.isArray(profiles)) {
    for (const p of profiles) {
      await sb.insert('notifications',{user_id:p.id,title:'✅ المنصة عادت للعمل!',body:'انتهت الصيانة — تفضل وابدأ التعلم 🚀',is_read:false}).catch(()=>{});
    }
  }
  showToast('✅ المنصة تعمل مجدداً + إشعار للطلاب');
}

// ═══════════════════════════════════════════════════════
//  SETTINGS (localStorage)
// ═══════════════════════════════════════════════════════
function getSettings() { return JSON.parse(localStorage.getItem('alshehab_platform_settings')||'{}'); }
function saveSettings(s) { localStorage.setItem('alshehab_platform_settings', JSON.stringify(s)); }

function loadSettings() {
  const s = getSettings();
  if (s.name)    document.getElementById('stName').value    = s.name;
  if (s.founder) document.getElementById('stFounder').value = s.founder;
  if (s.phone)   document.getElementById('stPhone').value   = s.phone;
  if (s.desc)    document.getElementById('stDesc').value    = s.desc;
  if (s.paymob_int) document.getElementById('stPmInt').value = s.paymob_int;
  if (s.paymob_if)  document.getElementById('stPmIF').value  = s.paymob_if;
  if (s.currency)   document.getElementById('stCurr').value  = s.currency;
  // toggles
  const tf = (id, key, def=true) => { const el=document.getElementById(id); if(el){ if(s[key]===false||s[key]===true) el.classList.toggle('on', s[key]!==false); } };
  tf('tReg','registration'); tf('tFree','free_courses'); tf('tXP','xp'); tf('tCerts','certs');
  if (s.maintenance) document.getElementById('tMaint').classList.add('on');
}

function savePlatform() {
  const s=getSettings(); s.name=document.getElementById('stName').value; s.founder=document.getElementById('stFounder').value; s.phone=document.getElementById('stPhone').value; s.desc=document.getElementById('stDesc').value;
  saveSettings(s); showToast('✅ تم حفظ بيانات المنصة');
}
function savePayment() {
  const s=getSettings(); s.paymob_int=document.getElementById('stPmInt').value; s.paymob_if=document.getElementById('stPmIF').value; s.currency=document.getElementById('stCurr').value;
  saveSettings(s); showToast('✅ تم حفظ إعدادات الدفع');
}
function toggleF(elId, key) {
  const el=document.getElementById(elId); el.classList.toggle('on');
  const s=getSettings(); s[key]=el.classList.contains('on'); saveSettings(s);
  showToast(el.classList.contains('on')?'✅ تفعيل':'⏹ إيقاف');
}

// ═══════════════════════════════════════════════════════
//  EXPORTS
// ═══════════════════════════════════════════════════════
async function exportCSV(type) {
  if (type==='students') {
    if (!allStudents.length) await loadStudents();
    dlCSV('students.csv', [['الاسم','الدور','XP','آخر نشاط'], ...allStudents.map(s=>[s.name||'—',s.role||'student',s.xp||0,s.last_active||'—'])]);
    showToast('✅ تصدير الطلاب');
  } else if (type==='revenue') {
    const months=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
    dlCSV('revenue.csv', [['الشهر','الإيرادات'], ...months.map((m,i)=>[m,0])]);
    showToast('✅ تصدير الإيرادات');
  } else if (type==='all') {
    const [courses,profiles,enrollments]=await Promise.all([sb.select('courses','order=created_at.desc').catch(()=>[]),sb.select('profiles','select=id,name,xp,role').catch(()=>[]),sb.select('enrollments','select=id,user_id,course_id,progress,completed').catch(()=>[])]);
    dlJSON('alshehab_backup_'+new Date().toISOString().slice(0,10)+'.json',{courses,profiles,enrollments});
    showToast('✅ تصدير JSON');
  }
}
