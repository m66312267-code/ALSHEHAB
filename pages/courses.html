<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IBDA3 — الكورسات</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <style>
.nav-item span svg, .bottom-nav-item span svg { display:block; transition:stroke .2s; }
    .nav-item:hover span svg { stroke: var(--accent); }
    .nav-item.active span svg { stroke: var(--accent); }
    .bottom-nav-item.active span svg { stroke: var(--accent); }
    .icon-btn svg { display:block; }
    .menu-btn svg { display:block; }
    .float-settings svg { display:block; }
  </style>
  <style>
    .page-title svg { display:inline-block; vertical-align:middle; margin-left:6px; stroke:var(--accent); }
    .course-thumb svg { display:block; margin:0 auto; stroke:rgba(255,255,255,0.7); }
    .course-meta2 svg { display:inline-block; vertical-align:middle; stroke:var(--text-dim); }
    .stars svg { display:inline-block; vertical-align:middle; }
    .badge-hot svg { display:inline-block; vertical-align:middle; stroke:currentColor; }
    .offline-badge svg { display:inline-block; vertical-align:middle; margin-left:4px; }
    #gradeBadge svg { display:inline-block; vertical-align:middle; margin-left:4px; stroke:var(--accent); }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>



<div id="toast"></div>
<div class="offline-badge" id="offlineBadge"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> أنت غير متصل بالإنترنت</div>

<div class="settings-panel" id="settingsPanel">
  <h4>🎨 لون المنصة</h4>
  <div class="theme-dots">
    <div class="tdot active" style="background:#00d4aa;" onclick="setColor('green')"></div>
    <div class="tdot" style="background:#3b82f6;" onclick="setColor('blue')"></div>
    <div class="tdot" style="background:#a855f7;" onclick="setColor('purple')"></div>
    <div class="tdot" style="background:#f97316;" onclick="setColor('orange')"></div>
    <div class="tdot" style="background:#ef4444;" onclick="setColor('red')"></div>
    <div class="tdot" style="background:#ec4899;" onclick="setColor('pink')"></div>
    <div class="tdot" style="background:#eab308;" onclick="setColor('gold')"></div>
    <div class="tdot" style="background:#84cc16;" onclick="setColor('olive')"></div>
  </div>
  <h4>🌙 المظهر</h4>
  <div style="display:flex;gap:8px;">
    <button class="ftab active" onclick="setMode('dark')" style="flex:1;padding:7px;">داكن</button>
    <button class="ftab" onclick="setMode('light')" style="flex:1;padding:7px;">فاتح</button>
  </div>
</div>
<button class="float-settings" onclick="toggleSettings()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93l-1.41 1.41M4.93 4.93l1.41 1.41M19.07 19.07l-1.41-1.41M4.93 19.07l1.41-1.41M12 2v2M12 20v2M2 12h2M20 12h2"/></svg></button>

<header class="topbar">
  <div class="logo-wrap"><div class="logo-bar"></div><span class="logo-text">إبداع</span></div>
  <div class="topbar-right">
    <div style="position:relative;">
      <button class="icon-btn" onclick="toggleNotif()" id="notifBtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="notif-dot" id="notifDot" style="display:none;"></span></button>
      <div class="notif-dropdown" id="notifDrop">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
          <h4 style="margin:0;">الإشعارات</h4>
          <span style="font-size:11px;color:var(--accent);cursor:pointer;" onclick="if(typeof Notifs!=='undefined')Notifs.markAllRead()">قراءة الكل</span>
        </div>
        <div id="notifList"><div style="text-align:center;color:var(--text-dim);font-size:12px;padding:10px;">جاري التحميل...</div></div>
      </div>
    </div>
    <button class="icon-btn" onclick="toggleTheme()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
    <div class="avatar-btn" onclick="window.location.href='profile.html'">A</div>
    <button class="menu-btn" id="menuBtn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
  </div>
</header>

<nav class="bottom-nav">
  <div class="bottom-nav-item" onclick="window.location.href='dashboard.html'"><span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>الرئيسية</div>
  <div class="bottom-nav-item active"><span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span>كورسات</div>
  <div class="bottom-nav-item" onclick="window.location.href='quiz.html'"><span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg></span>اختبارات</div>
  <div class="bottom-nav-item" onclick="window.location.href='profile.html'"><span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>حسابي</div>
</nav>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="nav-label">القائمة الرئيسية</div>
    <div class="nav-item" onclick="window.location.href='dashboard.html'"><span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span> الرئيسية</div>
    <div class="nav-item active"><span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span> الكورسات</div>
    <div class="nav-label">حسابي</div>
    <div class="nav-item" onclick="window.location.href='profile.html'"><span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span> الحساب</div>
    <div class="nav-item" onclick="window.location.href='admin.html'"><span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93l-1.41 1.41M4.93 4.93l1.41 1.41M19.07 19.07l-1.41-1.41M4.93 19.07l1.41-1.41M12 2v2M12 20v2M2 12h2M20 12h2"/></svg></span> لوحة التحكم</div>
    <div class="nav-item" onclick="window.location.href='about.html'"><span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></span> من نحن</div>
    <div class="nav-item" onclick="window.location.href='support.html'"><span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span> الدعم</div>
    <div class="nav-item" onclick="window.location.href='quiz.html'"><span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg></span> الاختبارات</div>
    <div class="sidebar-footer">
      <div class="nav-item" style="color:#ef4444;" onclick="sb.signOut()"><span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></span> تسجيل الخروج</div>
    </div>
  </aside>

  <main class="main">
    <div class="page active">
      <div class="page-title"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg> الكورسات</div>
      <div class="page-sub">اختر كورسك وابدأ رحلة التعلم</div>

      <div class="search-bar">
        <input class="search-inp" type="text" placeholder="ابحث عن كورس..." oninput="searchCourses(this.value)">
      </div>

      <div class="filter-bar">
        <button class="ftab active" onclick="filterCourses('all',this)">الكل</button>
        <button class="ftab" onclick="filterCourses('free',this)">مجاني</button>
        <button class="ftab" onclick="filterCourses('paid',this)">مدفوع</button>
        <button class="ftab" onclick="filterCourses('math',this)">رياضيات</button>
      </div>

      <div class="courses-grid" id="coursesGrid">
        <!-- الكورسات بتتحمل من الداتا -->
      </div>
      <div id="emptyState" style="display:none;text-align:center;padding:50px 20px;">
        <div style="margin-bottom:15px;opacity:0.4;"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg></div>
        <p style="color:var(--text-dim);font-size:14px;">مفيش كورسات في الفلتر ده</p>
      </div>
    </div>
  </main>
</div>

<script src="../js/shared.js"></script>
<script src="../js/supabase.js"></script>
<script>requireAuth(); if(typeof Notifs!=='undefined') Notifs.startPolling();</script>
<script>
  let allCourses = [];
  let currentFilter = 'all';
  let currentSearch = '';

  const thumbClasses = ['t1','t2','t3','t4','t5','t6'];
  const thumbSVGs = [`<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>`,`<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>`,`<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>`,`<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/><line x1="10" y1="3" x2="8" y2="21"/><line x1="16" y1="3" x2="14" y2="21"/></svg>`,`<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>`,`<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`,`<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>`,`<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>`,`<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>`,`<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>`];

  function renderCourses(list) {
    const grid = document.getElementById('coursesGrid');
    const empty = document.getElementById('emptyState');
    if (list.length === 0) { grid.innerHTML = ''; empty.style.display = 'block'; return; }
    empty.style.display = 'none';
    const enrolled = JSON.parse(localStorage.getItem('ibda3_enrolled') || '[]');
    grid.innerHTML = list.map((c, i) => {
      const isEnrolled = enrolled.includes(c.id);
      const tClass = thumbClasses[i % thumbClasses.length];
      const tThumb = thumbSVGs[i % thumbSVGs.length];
      const isFree = !c.price || c.price === 0 || c.price === '0';
      const priceTag = isFree ? `<span class="badge badge-free">مجاني</span>` : `<span class="badge badge-paid">${c.price} ج.م</span>`;
      const actionBtn = c.status === 'soon'
        ? `<button class="course-btn btn-soon">قريباً</button>`
        : isEnrolled
          ? `<button class="course-btn btn-enroll" onclick="openCourse('${c.id}')">استكمل ←</button>`
          : isFree
            ? `<button class="course-btn btn-enroll" onclick="enrollCourse('${c.id}')">ابدأ الآن</button>`
            : `<button class="course-btn btn-enroll" onclick="window.location.href='payment.html?id=${c.id}'">اشترك</button>`;
      const newBadge = c.is_new ? `<span class="badge badge-new">جديد</span>` : '';
      const hotBadge = c.is_hot ? `<span class="badge badge-hot"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg> الأكثر</span>` : '';
      const gradeMap = { grade1: 'الأول الثانوي', grade2: 'الثاني الثانوي', grade3: 'الثالث الثانوي' };
      const gradeBadge = c.grade ? `<span class="badge badge-grade">${gradeMap[c.grade] || c.grade}</span>` : '';
      const r = Math.round(c.rating||5); const stars = `<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`.repeat(r) + `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`.repeat(5-r);
      return `<div class="course-card" data-cat="${c.category||'other'}" data-id="${c.id}">
        ${newBadge||hotBadge||gradeBadge ? `<div class="top-badges">${gradeBadge}${newBadge}${hotBadge}</div>` : ''}
        ${c.cover_url
          ? `<div style="width:100%;height:160px;overflow:hidden;border-radius:16px 16px 0 0;flex-shrink:0;">
               <img src="${c.cover_url}" alt="${c.title}"
                 style="width:100%;height:100%;object-fit:cover;display:block;border-radius:0;">
             </div>`
          : `<div class="course-thumb ${tClass}" style="border-radius:16px 16px 0 0;">${tThumb}</div>`
        }
        <div class="course-info">
          <h4>${c.title}</h4>
          <p class="cdesc">${c.description||c.desc||''}</p>
          <div class="course-meta2">
            ${c.students ? `<span><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg> ${c.students}</span>` : ''}
            ${c.hours ? `<span>⏱ ${c.hours} ساعة</span>` : ''}
            ${c.lessons_count ? `<span><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg> ${c.lessons_count} درس</span>` : ''}
          </div>
          <div class="stars">${stars}</div>
          <div class="course-foot" style="margin-top:10px;">${priceTag}${actionBtn}</div>
        </div>
      </div>`;
    }).join('');
  }

  function getFiltered() {
    return allCourses.filter(c => {
      const matchCat = currentFilter === 'all' || (c.category||'').includes(currentFilter);
      const matchSearch = !currentSearch || (c.title||'').toLowerCase().includes(currentSearch);
      return matchCat && matchSearch;
    });
  }

  function filterCourses(cat, btn) {
    document.querySelectorAll('.ftab').forEach(t=>t.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = cat;
    renderCourses(getFiltered());
  }

  function searchCourses(q) {
    currentSearch = q.trim().toLowerCase();
    renderCourses(getFiltered());
  }

  async function enrollCourse(id) {
    await Courses.enroll(id);
    const course = allCourses.find(c => c.id === id);
    if (course) localStorage.setItem('ibda3_lastcourse', course.title);
    showToast('تم التسجيل في الكورس!');
    setTimeout(() => window.location.href = 'course-detail.html?id=' + id, 800);
  }

  function openCourse(id) { window.location.href = 'course-detail.html?id=' + id; }

  async function initCourses() {
    document.getElementById('coursesGrid').innerHTML = `
      <div style="grid-column:1/-1;text-align:center;padding:50px;">
        <div style="opacity:0.4;"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="animation:spin 1s linear infinite;"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg></div>
        <p style="color:var(--text-dim);font-size:13px;margin-top:10px;">جاري تحميل الكورسات...</p>
      </div>`;

    // جيب صف الطالب + role من Supabase مباشرة
    const user = sb.getUser();
    let userGrade = '';
    let userRole  = '';
    try {
      const profile = await sb.select('profiles', `select=grade,role&id=eq.${user.id}`);
      userRole  = profile?.[0]?.role  || '';
      userGrade = profile?.[0]?.grade || '';
      if (userGrade) localStorage.setItem('ibda3_grade', userGrade);
      else           localStorage.removeItem('ibda3_grade');
    } catch(e) {
      // fallback للـ cache لو فشل الاتصال
      userGrade = localStorage.getItem('ibda3_grade') || '';
    }

    // ✅ BLOCK: لو مش أدمن ومحددش صفه — أظهر شاشة بلوك كاملة
    if (!userGrade && userRole !== 'admin') {
      document.getElementById('coursesGrid').innerHTML = '';
      document.getElementById('emptyState').style.display = 'none';
      const blockDiv = document.createElement('div');
      blockDiv.style.cssText = 'grid-column:1/-1;';
      blockDiv.innerHTML = `
        <div style="text-align:center;padding:60px 20px;max-width:400px;margin:0 auto;">
          <div style="margin-bottom:16px;opacity:0.6;"><svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
          <h3 style="font-size:18px;font-weight:900;margin-bottom:8px;color:var(--text);">حدد صفك الدراسي أولاً</h3>
          <p style="font-size:13px;color:var(--text-dim);line-height:1.8;margin-bottom:24px;">
            لازم تحدد صفك الدراسي عشان نعرض لك<br>الكورسات المناسبة ليك بس
          </p>
          <button onclick="window.location.href='dashboard.html'" 
            style="background:var(--accent);color:#000;border:none;border-radius:12px;padding:14px 32px;font-family:'Cairo',sans-serif;font-size:14px;font-weight:700;cursor:pointer;width:100%;max-width:260px;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg> اختار صفك دلوقتي
          </button>
          <p style="font-size:11px;color:var(--text-dim);margin-top:16px;">هتتوجّه لصفحة الرئيسية لتحديد الصف</p>
        </div>`;
      document.getElementById('coursesGrid').parentNode.insertBefore(blockDiv, document.getElementById('coursesGrid'));
      return; // وقّف initCourses هنا
    }

    // عرض بادج الصف (للطلاب بس)
    if (userGrade) {
      const gradeNames = { grade1: 'الأول الثانوي', grade2: 'الثاني الثانوي', grade3: 'الثالث الثانوي' };
      const existing = document.getElementById('gradeBadge');
      if (!existing) {
        const badge = document.createElement('div');
        badge.id = 'gradeBadge';
        badge.style.cssText = 'background:rgba(0,212,170,0.1);border:1px solid var(--accent);border-radius:20px;padding:7px 16px;font-size:12px;font-weight:700;color:var(--accent);display:inline-block;margin-bottom:14px;';
        badge.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg> صفك: ` + (gradeNames[userGrade] || userGrade);
        document.querySelector('.page.active').insertBefore(badge, document.querySelector('.search-bar'));
      }
    }

    // ✅ PERF: جيب الكورسات
    allCourses = await Courses.getAll();

    // فلتر الكورسات بالصف — الأدمن يشوف الكل
    if (userGrade && userRole !== 'admin') {
      allCourses = allCourses.filter(c => !c.grade || c.grade === userGrade);
    }

    if (allCourses.length === 0) {
      document.getElementById('coursesGrid').innerHTML = `
        <div style="grid-column:1/-1;text-align:center;padding:60px 20px;">
          <div style="margin-bottom:15px;opacity:0.4;"><svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></div>
          <p style="color:var(--text-dim);font-size:14px;">لم يتم إضافة كورسات لصفك بعد</p>
          <p style="color:var(--text-dim);font-size:12px;margin-top:6px;">هيتم إضافة كورسات قريباً</p>
        </div>`;
      return;
    }
    renderCourses(allCourses);
  }

  initCourses();
</script>
</body>
</html>
